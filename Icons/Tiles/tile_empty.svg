<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- Top-Left Corner Bracket -->
  <rect x="1" y="1" width="3" height="1" fill="#4e5666" />
  <rect x="1" y="2" width="1" height="2" fill="#4e5666" />
  
  <!-- Top-Right Corner Bracket -->
  <rect x="12" y="1" width="3" height="1" fill="#4e5666" />
  <rect x="14" y="2" width="1" height="2" fill="#4e5666" />
  
  <!-- Bottom-Left Corner Bracket -->
  <rect x="1" y="14" width="3" height="1" fill="#4e5666" />
  <rect x="1" y="12" width="1" height="2" fill="#4e5666" />
  
  <!-- Bottom-Right Corner Bracket -->
  <rect x="12" y="14" width="3" height="1" fill="#4e5666" />
  <rect x="14" y="12" width="1" height="2" fill="#4e5666" />
  
  <!-- Center Guide Dot (Restored to Original Color) -->
  <rect x="7" y="7" width="2" height="2" fill="#2d2d2d" />
</svg>
