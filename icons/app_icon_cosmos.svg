    <rect x="1" y="1" width="14" height="14" fill="#1a1a1a" />
    <rect x="1" y="1" width="14" height="13" fill="#29adff" />
    <rect x="1" y="1" width="13" height="1" fill="#abffe6" />
    <rect x="1" y="2" width="1" height="11" fill="#abffe6" />
    <rect x="2" y="13" width="13" height="1" fill="#1d2b53" />
    <rect x="14" y="2" width="1" height="12" fill="#1d2b53" />
    <rect x="3" y="3" width="10" height="8" fill="#abffe6" />
