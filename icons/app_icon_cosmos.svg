    <rect x="1" y="1" width="14" height="14" fill="#1a1a1a" />
    <rect x="1" y="1" width="14" height="13" fill="#7e2553" />
    <rect x="1" y="1" width="13" height="1" fill="#ff77a8" />
    <rect x="1" y="2" width="1" height="11" fill="#ff77a8" />
    <rect x="2" y="13" width="13" height="1" fill="#1d2b53" />
    <rect x="14" y="2" width="1" height="12" fill="#1d2b53" />
    <rect x="3" y="3" width="10" height="8" fill="#ff77a8" />
    <rect x="4" y="4" width="8" height="7" fill="#7e2553" />
  </g>

  <!-- Top-Right: Dark Yellow Tile -->
  <g transform="translate(32,16)">
    <rect x="1" y="1" width="14" height="14" fill="#1a1a1a" />
    <rect x="1" y="1" width="14" height="13" fill="#c49c00" />
    <rect x="1" y="1" width="13" height="1" fill="#ffe066" />
    <rect x="1" y="2" width="1" height="11" fill="#ffe066" />
    <rect x="2" y="13" width="13" height="1" fill="#704700" />
    <rect x="14" y="2" width="1" height="12" fill="#704700" />
    <rect x="3" y="3" width="10" height="8" fill="#ffe066" />
    <rect x="4" y="4" width="8" height="7" fill="#c49c00" />
