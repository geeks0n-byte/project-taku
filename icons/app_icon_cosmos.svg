<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <!-- Clipping path to maintain the rounded corners of the app icon -->
    <clipPath id="app-clip">
      <rect x="0" y="0" width="64" height="64" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#app-clip)">
    <!-- Deep Space Blue Base -->
    <rect width="64" height="64" fill="#00123a" />
    
    <!-- Distant/Dim Stars -->
    <g fill="#404040">
      <path d="M6 10h1v1h-1z M24 5h1v1h-1z M48 12h1v1h-1z M14 28h1v1h-1z M38 25h1v1h-1z M58 20h1v1h-1z M5 45h1v1h-1z M26 42h1v1h-1z M50 48h1v1h-1z M18 58h1v1h-1z M44 56h1v1h-1z M34 14h1v1h-1z" />
    </g>
    
    <!-- Bright/Foreground Stars -->
    <g fill="#ffffff">
      <path d="M14 14h1v1h-1z M40 8h1v1h-1z M54 28h1v1h-1z M8 32h1v1h-1z M46 36h1v1h-1z M22 52h1v1h-1z M60 48h1v1h-1z M10 56h1v1h-1z M32 60h1v1h-1z M28 20h1v1h-1z" />
    </g>
  </g>

  <!-- Top-Left: Purple Tile -->
