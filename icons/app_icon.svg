    <rect x="1" y="1" width="14" height="14" fill="#1a1a1a" />
    <rect x="1" y="1" width="14" height="13" fill="#00e436" />
    <rect x="1" y="1" width="13" height="1" fill="#a1ff00" />
    <rect x="1" y="2" width="1" height="11" fill="#a1ff00" />
    <rect x="2" y="13" width="13" height="1" fill="#1f5125" />
    <rect x="14" y="2" width="1" height="12" fill="#1f5125" />
    <rect x="3" y="3" width="10" height="8" fill="#a1ff00" />
    <rect x="4" y="4" width="8" height="7" fill="#00e436" />
