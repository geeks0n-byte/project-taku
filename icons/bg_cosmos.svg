<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" width="1080" height="1920" shape-rendering="crispEdges">
  <!-- The Deep Void: Very Dark Blue with NO lighter areas -->
  <rect width="360" height="640" fill="#00123a" />

  <!-- DENSE STARFIELD (No Nebulas) -->

  <!-- Distant Background Dust (Tiny 1x1, dark gray, 10-20 points) -->
  <g fill="#404040">
    <path d="M20 40h1v1h-1z M80 90h1v1h-1z M150 30h1v1h-1z M280 60h1v1h-1z M320 150h1v1h-1z M50 200h1v1h-1z M180 250h1v1h-1z M250 300h1v1h-1z M30 350h1v1h-1z M100 400h1v1h-1z M280 450h1v1h-1z M60 500h1v1h-1z M150 550h1v1h-1z M220 600h1v1h-1z M320 580h1v1h-1z M10 630h1v1h-1z" />
    <path d="M45 45h1v1h-1z M112 110h1v1h-1z M205 75h1v1h-1z M312 212h1v1h-1z M55 315h1v1h-1z M140 430h1v1h-1z M275 525h1v1h-1z M350 610h1v1h-1z" />
  </g>

  <!-- Standard Foreground Stars (1x1 pure white) -->
  <g fill="#ffffff">
    <path d="M60 80h1v1h-1z M250 150h1v1h-1z M120 350h1v1h-1z M300 80h1v1h-1z M40 300h1v1h-1z M220 50h1v1h-1z M180 420h1v1h-1z M5 580h1v1h-1z M355 600h1v1h-1z M90 120h1v1h-1z M280 280h1v1h-1z M100 480h1v1h-1z   M250 420h1v1h-1z M40 220h1v1h-1z M310 520h1v1h-1z M180 600h1v1h-1z M300 200h1v1h-1z" />
    <path d="M15 15h1v1h-1z M345 345h1v1h-1z M25 615h1v1h-1z M330 25h1v1h-1z M75 375h1v1h-1z M210 510h1v1h-1z M195 95h1v1h-1z M135 135h1v1h-1z M315 315h1v1h-1z M65 265h1v1h-1z" />
  </g>

  <!-- Colored Accents (1x1, strictly limited palette) -->
  <path d="M30 60h1v1h-1z M200 100h1v1h-1z M80 280h1v1h-1z M220 380h1v1h-1z M40 450h1v1h-1z M120 180h1v1h-1z M340 500h1v1h-1z M65 590h1v1h-1z" fill="#abffe6" /> <!-- Cyan (matches game blue) -->
  <path d="M120 70h1v1h-1z M40 220h1v1h-1z M160 320h1v1h-1z M280 360h1v1h-1z M90 520h1v1h-1z M310 240h1v1h-1z" fill="#ff77a8" /> <!-- Pink (matches game magenta) -->

  <!-- Bright Sparkling Stars (Small 3x3 pixel art crosses, white) -->
  <g fill="#ffffff">
    <!-- Top-Mid -->
    <rect x="180" y="110" width="1" height="3" />
    <rect x="179" y="111" width="3" height="1" />
    <!-- Center-Left -->
    <rect x="70" y="320" width="1" height="3" />
    <rect x="69" y="321" width="3" height="1" />
    <!-- Bottom-Right -->
    <rect x="290" y="550" width="1" height="3" />
    <rect x="289" y="551" width="3" height="1" />
    <!-- Far Top-Right -->
    <rect x="330" y="220" width="1" height="3" />
    <rect x="329" y="221" width="3" height="1" />
  </g>
</svg>
