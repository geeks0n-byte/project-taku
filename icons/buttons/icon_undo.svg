<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- UNDO (White Arching Left Arrow - Moved 1px Left) -->
  <g transform="translate(0, 1)">
    <!-- Drop Shadow -->
    <g fill="#1d2b53" transform="translate(0, 1)">
      <!-- Arrowhead -->
      <rect x="2" y="5" width="2" height="2" />
      <rect x="4" y="4" width="2" height="4" />
      <rect x="6" y="3" width="2" height="6" />
      <!-- Arching tail -->
      <rect x="8" y="4" width="3" height="2" />
      <rect x="11" y="5" width="2" height="2" />
      <rect x="12" y="7" width="2" height="4" />
    </g>
    <!-- Main White Graphic -->
    <g fill="#ffffff">
      <!-- Arrowhead -->
      <rect x="2" y="5" width="2" height="2" />
      <rect x="4" y="4" width="2" height="4" />
      <rect x="6" y="3" width="2" height="6" />
      <!-- Arching tail -->
      <rect x="8" y="4" width="3" height="2" />
      <rect x="11" y="5" width="2" height="2" />
      <rect x="12" y="7" width="2" height="4" />
    </g>
  </g>
</svg>
