<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- RULES (Book with white pages and brown cover) -->
  <g transform="translate(1, 2)">
    <g fill="#1d2b53" transform="translate(0, 1)">
      <rect x="1" y="1" width="12" height="10"/>
    </g>
    <!-- Cover -->
    <rect x="1" y="1" width="12" height="10" fill="#9e5b22"/>
    <!-- Pages -->
    <rect x="2" y="2" width="10" height="8" fill="#ffffff"/>
    <!-- Binding Spine -->
    <rect x="7" y="1" width="1" height="10" fill="#1d2b53"/>
    <!-- Text Lines -->
    <rect x="3" y="3" width="3" height="1" fill="#c2c3c7"/>
    <rect x="3" y="5" width="3" height="1" fill="#c2c3c7"/>
    <rect x="3" y="7" width="3" height="1" fill="#c2c3c7"/>
    <rect x="9" y="3" width="2" height="1" fill="#c2c3c7"/>
    <rect x="9" y="5" width="2" height="1" fill="#c2c3c7"/>
    <rect x="9" y="7" width="2" height="1" fill="#c2c3c7"/>
  </g>
</svg>
