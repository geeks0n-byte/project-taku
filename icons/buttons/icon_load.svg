<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- LOAD (Yellow folder, green arrow pointing up) -->
  <g transform="translate(1, 1)">
    <g fill="#1d2b53" transform="translate(0, 1)">
      <rect x="1" y="3" width="5" height="2" />
      <rect x="1" y="5" width="12" height="7" />
      <rect x="4" y="0" width="6" height="6" />
    </g>
    <!-- Back of Folder -->
    <rect x="1" y="3" width="5" height="2" fill="#e6a822"/>
    <rect x="1" y="5" width="12" height="2" fill="#e6a822"/>
    <!-- White Paper inside -->
    <rect x="4" y="0" width="6" height="6" fill="#ffffff"/>
    <!-- Green UP Arrow -->
    <rect x="6" y="1" width="2" height="2" fill="#42ca59"/>
    <rect x="5" y="3" width="4" height="2" fill="#42ca59"/>
    <rect x="6" y="5" width="2" height="2" fill="#42ca59"/>
    <!-- Front of Folder -->
    <rect x="1" y="6" width="12" height="6" fill="#ffcc00"/>
  </g>
</svg>
