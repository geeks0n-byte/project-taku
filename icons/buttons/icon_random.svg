<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- RANDOM (Overlapping Dice) -->
  <g transform="translate(1, 1)">
    <!-- Drop Shadow Layer for Both Dice -->
    <g fill="#1d2b53" transform="translate(0, 1)">
      <!-- Back die shadow -->
      <rect x="6" y="1" width="8" height="8" />
      <!-- Front die shadow -->
      <rect x="1" y="5" width="8" height="8" />
    </g>
    
    <!-- Back Die (Gray) -->
    <rect x="6" y="1" width="8" height="8" fill="#c2c3c7" />
    <rect x="7" y="2" width="2" height="2" fill="#1d2b53" />
    <rect x="11" y="6" width="2" height="2" fill="#1d2b53" />
    
    <!-- Front Die (White) -->
    <rect x="1" y="5" width="8" height="8" fill="#ffffff" />
    <rect x="2" y="6" width="2" height="2" fill="#1d2b53" />
    <rect x="4" y="8" width="2" height="2" fill="#1d2b53" />
    <rect x="6" y="10" width="2" height="2" fill="#1d2b53" />
  </g>
</svg>
