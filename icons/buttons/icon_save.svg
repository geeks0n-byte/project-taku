<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- SAVE (Blue Floppy Disk) -->
  <g transform="translate(2, 1)">
    <g fill="#1d2b53" transform="translate(0, 1)">
      <rect x="1" y="1" width="10" height="11" />
    </g>
    <!-- Blue Body -->
    <rect x="1" y="1" width="10" height="11" fill="#3b5dc9"/>
    <!-- Top Metal Slider -->
    <rect x="3" y="1" width="4" height="4" fill="#c2c3c7"/>
    <rect x="5" y="2" width="1" height="2" fill="#1a1a1a"/>
    <!-- White Bottom Label -->
    <rect x="2" y="7" width="8" height="5" fill="#ffffff"/>
    <!-- Label Text Lines -->
    <rect x="3" y="8" width="6" height="1" fill="#7d7d7d"/>
    <rect x="3" y="10" width="6" height="1" fill="#7d7d7d"/>
  </g>
</svg>
