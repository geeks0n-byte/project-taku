name: Logic tests

on:
  push:
  pull_request:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .godot-ci
          key: godot-4.7.2-linux-x86_64-v2

      - name: Download Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-ci
          curl -L --fail -o .godot-ci/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o .godot-ci/godot.zip -d .godot-ci
          chmod +x .godot-ci/Godot_v4.7.2-stable_linux.x86_64
          rm .godot-ci/godot.zip

      - name: Import project
        run: |
          .godot-ci/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import >/tmp/godot-import.log 2>&1 || true
          tail -n 40 /tmp/godot-import.log || true

      - name: Run logic tests
        run: |
          set -euo pipefail
          .godot-ci/Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/run_logic_tests.gd 2>&1 | tee /tmp/logic-tests.log
          grep -q "logic_tests: .* 0 failed" /tmp/logic-tests.log
          ! grep -q "SCRIPT ERROR: Parse Error" /tmp/logic-tests.log
