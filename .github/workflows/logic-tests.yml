name: Logic tests

on:
  push:
  pull_request:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .godot-ci
          key: godot-4.7.2-linux-x86_64

      - name: Download Godot 4.7.2
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p .godot-ci
          curl -L --fail -o .godot-ci/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -o .godot-ci/godot.zip -d .godot-ci
          chmod +x .godot-ci/Godot_v4.7.2-stable_linux.x86_64
          rm .godot-ci/godot.zip

      - name: Import project (generate .godot)
        run: |
          .godot-ci/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import || true

      - name: Run logic tests
        run: |
          .godot-ci/Godot_v4.7.2-stable_linux.x86_64 --headless --path . -s res://tests/run_logic_tests.gd
