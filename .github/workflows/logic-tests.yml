name: Logic tests

on:
  push:
  pull_request:

jobs:
  logic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: .godot-ci
          key: godot-${{ hashFiles('tools/godot.env') }}-linux-x86_64

      - name: Ensure Godot
        run: |
          set -euo pipefail
          chmod +x tools/ensure_godot.sh
          GODOT_EXE="$(bash tools/ensure_godot.sh)"
          echo "GODOT_EXE=$GODOT_EXE" >> "$GITHUB_ENV"
          "$GODOT_EXE" --version

      - name: Import project
        run: |
          set -euo pipefail
          "$GODOT_EXE" --headless --path . --import 2>&1 | tee /tmp/godot-import.log

      - name: Run export smoke
        run: |
          set -euo pipefail
          "$GODOT_EXE" --headless --path . -s res://tests/run_export_smoke.gd 2>&1 | tee /tmp/export-smoke.log
          grep -q "export_smoke: 1 passed, 0 failed" /tmp/export-smoke.log
          ! grep -q "SCRIPT ERROR: Parse Error" /tmp/export-smoke.log

      - name: Run logic tests
        run: |
          set -euo pipefail
          "$GODOT_EXE" --headless --path . -s res://tests/run_logic_tests.gd 2>&1 | tee /tmp/logic-tests.log
          grep -q "logic_tests: .* 0 failed" /tmp/logic-tests.log
          ! grep -q "SCRIPT ERROR: Parse Error" /tmp/logic-tests.log
