<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="120" height="120" shape-rendering="crispEdges">
  <!-- 14x14 Hazard Striping (Leaves exactly 1px gap on all sides) -->
  <g fill="#ff3333">
    <!-- Outer Border -->
    <rect x="1" y="1" width="14" height="1" />
    <rect x="1" y="14" width="14" height="1" />
    <rect x="1" y="2" width="1" height="12" />
    <rect x="14" y="2" width="1" height="12" />

    <!-- Inner Diagonal Stripes (2px thick, bottom-left to top-right) -->
    <!-- Row 2 -->
    <rect x="2" y="2" width="2" height="1" />
    <rect x="6" y="2" width="2" height="1" />
    <rect x="10" y="2" width="2" height="1" />

    <!-- Row 3 -->
    <rect x="2" y="3" width="1" height="1" />
    <rect x="5" y="3" width="2" height="1" />
    <rect x="9" y="3" width="2" height="1" />
    <rect x="13" y="3" width="1" height="1" />

    <!-- Row 4 -->
    <rect x="4" y="4" width="2" height="1" />
    <rect x="8" y="4" width="2" height="1" />
    <rect x="12" y="4" width="2" height="1" />

    <!-- Row 5 -->
    <rect x="3" y="5" width="2" height="1" />
    <rect x="7" y="5" width="2" height="1" />
    <rect x="11" y="5" width="2" height="1" />

    <!-- Row 6 -->
    <rect x="2" y="6" width="2" height="1" />
    <rect x="6" y="6" width="2" height="1" />
    <rect x="10" y="6" width="2" height="1" />

    <!-- Row 7 -->
    <rect x="2" y="7" width="1" height="1" />
    <rect x="5" y="7" width="2" height="1" />
    <rect x="9" y="7" width="2" height="1" />
    <rect x="13" y="7" width="1" height="1" />

    <!-- Row 8 -->
    <rect x="4" y="8" width="2" height="1" />
    <rect x="8" y="8" width="2" height="1" />
    <rect x="12" y="8" width="2" height="1" />

    <!-- Row 9 -->
    <rect x="3" y="9" width="2" height="1" />
    <rect x="7" y="9" width="2" height="1" />
    <rect x="11" y="9" width="2" height="1" />

    <!-- Row 10 -->
    <rect x="2" y="10" width="2" height="1" />
    <rect x="6" y="10" width="2" height="1" />
    <rect x="10" y="10" width="2" height="1" />

    <!-- Row 11 -->
    <rect x="2" y="11" width="1" height="1" />
    <rect x="5" y="11" width="2" height="1" />
    <rect x="9" y="11" width="2" height="1" />
    <rect x="13" y="11" width="1" height="1" />

    <!-- Row 12 -->
    <rect x="4" y="12" width="2" height="1" />
    <rect x="8" y="12" width="2" height="1" />
    <rect x="12" y="12" width="2" height="1" />

    <!-- Row 13 -->
    <rect x="3" y="13" width="2" height="1" />
    <rect x="7" y="13" width="2" height="1" />
    <rect x="11" y="13" width="2" height="1" />
  </g>
</svg>
