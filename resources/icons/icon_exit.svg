<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="128" height="128" shape-rendering="crispEdges">
  <!-- EXIT / MAIN MENU (Classic Home Icon) -->
  <g>
    <!-- Drop Shadow Layer -->
    <g fill="#1d2b53" transform="translate(0, 1)">
      <!-- Roof Shadow -->
      <rect x="7" y="3" width="2" height="1" />
      <rect x="6" y="4" width="4" height="1" />
      <rect x="5" y="5" width="6" height="1" />
      <rect x="4" y="6" width="8" height="1" />
      <rect x="3" y="7" width="10" height="1" />
      <rect x="2" y="8" width="12" height="1" />
      <!-- Chimney Shadow -->
      <rect x="10" y="4" width="2" height="3" />
      <!-- House Body Shadow -->
      <rect x="4" y="9" width="8" height="5" />
    </g>

    <!-- Main Graphic -->
    <!-- Chimney (Brown) -->
    <rect x="10" y="4" width="2" height="3" fill="#9e5b22" />
    
    <!-- Roof (Red) -->
    <rect x="7" y="3" width="2" height="1" fill="#ff3333" />
    <rect x="6" y="4" width="4" height="1" fill="#ff3333" />
    <rect x="5" y="5" width="6" height="1" fill="#ff3333" />
    <rect x="4" y="6" width="8" height="1" fill="#ff3333" />
    <rect x="3" y="7" width="10" height="1" fill="#ff3333" />
    <rect x="2" y="8" width="12" height="1" fill="#ff3333" />
    
    <!-- House Body (Gray) -->
    <rect x="4" y="9" width="8" height="5" fill="#c2c3c7" />
    
    <!-- Door (Dark Blue) -->
    <rect x="7" y="10" width="2" height="4" fill="#1d2b53" />
  </g>
</svg>
