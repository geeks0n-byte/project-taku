<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <!-- NO SPOILERS — dim hint bulb + prohibition slash (slash matches undo nothing) -->
  <!-- shadow -->
  <rect x="24" y="16" width="16" height="4" fill="#1d2b53"/>
  <rect x="20" y="20" width="24" height="4" fill="#1d2b53"/>
  <rect x="16" y="24" width="32" height="8" fill="#1d2b53"/>
  <rect x="12" y="32" width="40" height="12" fill="#1d2b53"/>
  <rect x="16" y="44" width="32" height="4" fill="#1d2b53"/>
  <rect x="20" y="48" width="24" height="4" fill="#1d2b53"/>
  <rect x="24" y="52" width="16" height="6" fill="#1d2b53"/>
  <!-- cap -->
  <rect x="24" y="12" width="16" height="4" fill="#5f6790"/>
  <rect x="20" y="16" width="24" height="4" fill="#5f6790"/>
  <rect x="24" y="16" width="16" height="2" fill="#83769c"/>
  <!-- glass -->
  <rect x="16" y="20" width="32" height="8" fill="#7587a8"/>
  <rect x="12" y="28" width="40" height="12" fill="#7587a8"/>
  <rect x="16" y="40" width="32" height="4" fill="#7587a8"/>
  <rect x="20" y="44" width="24" height="4" fill="#7587a8"/>
  <!-- highlight -->
  <rect x="20" y="24" width="12" height="8" fill="#c2c3c7"/>
  <rect x="20" y="24" width="8" height="4" fill="#fff1e8"/>
  <!-- base -->
  <rect x="24" y="48" width="16" height="6" fill="#83769c"/>
  <rect x="24" y="48" width="16" height="2" fill="#c2c3c7"/>
  <rect x="28" y="54" width="8" height="4" fill="#5f6790"/>
  <!-- prohibition slash -->
  <line x1="14" y1="50" x2="50" y2="14" stroke="#000000" stroke-width="6" stroke-linecap="square"/>
  <line x1="14" y1="50" x2="50" y2="14" stroke="#ff004d" stroke-width="4" stroke-linecap="square"/>
</svg>
