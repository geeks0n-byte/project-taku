<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256" shape-rendering="crispEdges">
  <defs>
    <clipPath id="app-clip">
      <rect x="0" y="0" width="64" height="64" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#app-clip)">
    <rect width="64" height="64" fill="#00123a" />
    <g fill="#404040">
      <path d="M1 33h1v1h-1z M2 22h1v1h-1z M4 16h1v1h-1z M14 61h1v1h-1z M25 0h1v1h-1z M30 4h1v1h-1z M30 63h1v1h-1z" />
    </g>
    <g fill="#ffffff">
      <path d="M0 26h1v1h-1z M1 19h1v1h-1z M43 58h1v1h-1z M44 0h1v1h-1z M47 58h1v1h-1z M48 63h1v1h-1z M59 39h1v1h-1z M60 21h1v1h-1z M60 33h1v1h-1z" />
    </g>
  </g>

  <!-- 2×2 tile grid: 26px tiles, 6px margin (centered on 64×64 canvas) -->
  <!-- Top-Left: Shifter (purple) -->
  <g transform="translate(6,6)">
    <rect x="1" y="1" width="23" height="23" fill="#1a1a1a" />
    <rect x="1" y="1" width="23" height="21" fill="#7e2553" />
    <rect x="1" y="1" width="21" height="2" fill="#ff77a8" />
    <rect x="1" y="3" width="2" height="18" fill="#ff77a8" />
    <rect x="3" y="21" width="21" height="1" fill="#1d2b53" />
    <rect x="22" y="3" width="2" height="19" fill="#1d2b53" />
    <rect x="4" y="4" width="17" height="13" fill="#ff77a8" />
    <rect x="6" y="6" width="13" height="11" fill="#7e2553" />
  </g>

  <!-- Top-Right: Yellow -->
  <g transform="translate(32,6)">
    <rect x="1" y="1" width="23" height="23" fill="#1a1a1a" />
    <rect x="1" y="1" width="23" height="21" fill="#c49c00" />
    <rect x="1" y="1" width="21" height="2" fill="#ffe066" />
    <rect x="1" y="3" width="2" height="18" fill="#ffe066" />
    <rect x="3" y="21" width="21" height="1" fill="#704700" />
    <rect x="22" y="3" width="2" height="19" fill="#704700" />
    <rect x="4" y="4" width="17" height="13" fill="#ffe066" />
    <rect x="6" y="6" width="13" height="11" fill="#c49c00" />
  </g>

  <!-- Bottom-Left: Blue -->
  <g transform="translate(6,32)">
    <rect x="1" y="1" width="23" height="23" fill="#1a1a1a" />
    <rect x="1" y="1" width="23" height="21" fill="#29adff" />
    <rect x="1" y="1" width="21" height="2" fill="#abffe6" />
    <rect x="1" y="3" width="2" height="18" fill="#abffe6" />
    <rect x="3" y="21" width="21" height="1" fill="#1d2b53" />
    <rect x="22" y="3" width="2" height="19" fill="#1d2b53" />
    <rect x="4" y="4" width="17" height="13" fill="#abffe6" />
    <rect x="6" y="6" width="13" height="11" fill="#29adff" />
  </g>

  <!-- Bottom-Right: Green (joker) -->
  <g transform="translate(32,32)">
    <rect x="1" y="1" width="23" height="23" fill="#1a1a1a" />
    <rect x="1" y="1" width="23" height="21" fill="#00e436" />
    <rect x="1" y="1" width="21" height="2" fill="#a1ff00" />
    <rect x="1" y="3" width="2" height="18" fill="#a1ff00" />
    <rect x="3" y="21" width="21" height="1" fill="#1f5125" />
    <rect x="22" y="3" width="2" height="19" fill="#1f5125" />
    <rect x="4" y="4" width="17" height="13" fill="#a1ff00" />
    <rect x="6" y="6" width="13" height="11" fill="#00e436" />
  </g>
</svg>
